<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SiFinance Profile</title>
</head>
<body>
    <header class="main-header">
        <div class="header-logo">
            <h1>SiFinance</h1>
        </div>

        <div class="header-actions">
            <button type="button" class="header-icon-btn" title="Modo Escuro">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <button type="button" class="header-icon-btn" title="Notificações">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>

            <a href="profile.html" class="header-icon-btn profile-icon-btn" title="Meu Perfil" id="profile-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
        </div>
    </header>

    <div class="container">
        <aside class="aside-bar closed" id="sidebar">
            <div class="toggle-box" id="toggle-sidebar">
                <h2 class="sidebar-title">&gt; Ferramentas</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="../../Home/public/home.html" class="menu-item active">Dashboard Inicial</a>
                <a href="minhas-financas.html" class="menu-item">Minhas Finanças</a>
                <a href="alerta-dividas.html" class="menu-item">Alerta de Dívidas</a>
                <a href="orcamento.html" class="menu-item">Orçamento Inteligente</a>
                <a href="investimentos.html" class="menu-item">Investimentos</a>
                <a href="calculadoras.html" class="menu-item">Calculadoras</a>
            </nav>
        </aside>

        <main class="main-content">
            <h2 class="titulo-principal">Perfil</h2>
            
            <div class="profile-card">
                <div class="profile-left-column">
                    <div class="profile-avatar-box">
                        <span>Foto de Perfil</span>
                    </div>
                    
                    <div class="input-full-container">
                        <label>Nome</label>
                        <input type="text" id="input-name" placeholder="Digite seu nome">
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label>Idade</label>
                            <input type="number" id="input-age" placeholder="Idade">
                        </div>
                        <div class="input-group">
                            <label>Telefone de Contato</label>
                            <input type="tel" id="input-phone" placeholder="(00) 00000-0000">
                        </div>
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label>Nome de Usuário</label>
                            <input type="text" id="input-username" placeholder="@usuario">
                        </div>
                        <div class="input-group">
                            <label>E-mail</label>
                            <input type="email" id="input-email" placeholder="seu@email.com">
                        </div>
                    </div>
                </div>

                <div class="profile-vertical-divider"></div>

                <div class="profile-right-column">
                </div>
            </div>
                
        </main>
    </div>
    



    <script src="script.js"></script>
</body>
</html>
